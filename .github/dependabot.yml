version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # The root CLI module has zero dependencies; only the gui module
  # (Fyne and its transitive tree) needs watching.
  - package-ecosystem: gomod
    directory: "/gui"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(gui)"
