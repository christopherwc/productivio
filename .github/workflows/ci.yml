# Continuous integration.
#
# The suite runs on both target platforms, because the platform package
# is the whole reason this project cares about the difference. Coverage
# is combined afterwards so the macOS branches are covered by the macOS
# runs and the Linux branches by the Linux runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.23"
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod is not tidy; run 'go mod tidy'"; exit 1
          fi

      - run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          # v0.7.0+ requires Go >= 1.25; pin to the newest release that
          # still builds with this job's Go 1.23.
          version: v0.6.1
          install-go: false

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every combination report, so one platform's failure does not
      # hide another's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Report the environment under test
        run: go version && go env GOOS GOARCH

      # The race detector needs cgo, so it is enabled for this step
      # only; everything else stays static.
      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage-${{ matrix.os }}-${{ matrix.go }}.out ./internal/...

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go }}
          path: coverage-*.out
          retention-days: 1

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.23"
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          merge-multiple: true

      # gocovmerge is not in the standard toolchain, so the profiles are
      # concatenated by hand: keep one "mode:" line, then every block.
      - name: Combine the profiles
        run: |
          echo "mode: set" > combined.out
          for f in coverage-*.out; do tail -n +2 "$f" >> "$f.body"; done
          sort -u coverage-*.out.body | grep -v '^mode:' >> combined.out || true
          go tool cover -func=combined.out | tail -20

      - name: Enforce the threshold
        run: |
          total=$(go tool cover -func=combined.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total statement coverage: $total%"
          # 99.9%: one statement is documented as unreachable in
          # internal/core/store.go. See the README.
          awk -v t="$total" 'BEGIN { exit (t >= 99.5) ? 0 : 1 }' || {
            echo "Coverage $total% is below the 99.5% floor"; exit 1; }

  gui:
    name: GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Fyne needs cgo; this overrides the workflow-level CGO_ENABLED=0
      # for every step in this job. The gui/ module is deliberately
      # separate from the root module so that override stays scoped
      # here — see the root README's "How the GUI works" section.
      CGO_ENABLED: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Newer than the CLI's Lint/Test/Cross-compile jobs
          # (deliberately), and pinned to an exact patch rather than a
          # floating minor: govulncheck flags standard-library CVEs
          # reachable at the toolchain version used to build. "1.25"
          # resolved to 1.25.12 here, one patch behind the actual
          # fixes (1.25.13) — pin the current, actively-maintained
          # 1.26 line instead of chasing 1.25 patches.
          go-version: "1.26.8"
          cache: false

      # Fyne is cgo-linked against GL/X11 even for headless tests.
      # macos-latest already has everything it needs via Xcode CLT.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # xorg-dev + libgl1-mesa-dev alone are not enough: this glfw
        # version's Wayland backend is compiled in unconditionally and
        # needs its headers too, even though the CI runner never has a
        # real display.
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Check formatting
        working-directory: gui
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy
        working-directory: gui
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "gui/go.mod is not tidy; run 'go mod tidy' in gui/"; exit 1
          fi

      - name: Verify module checksums
        working-directory: gui
        run: go mod verify

      - name: Vulnerability scan
        working-directory: gui
        # Pinned version, not @latest: staticcheck's @latest already
        # broke this CI once by silently requiring a newer Go than the
        # job had (see the Lint job's staticcheck step).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - run: go vet ./...
        working-directory: gui

      # No numeric coverage floor here, unlike the CLI's ./internal/...:
      # widget-wiring code doesn't reach the same statement-coverage
      # bar as domain logic, and the domain logic itself is already
      # covered by internal/core's own suite, which this package calls
      # into rather than reimplementing. See CONTRIBUTING.md.
      - name: Test (headless — see internal/ui's use of fyne.io/fyne/v2/test)
        working-directory: gui
        run: go test ./...

      - name: Build
        working-directory: gui
        run: go build ./...

  build:
    name: Cross-compile
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.23"
          cache: false

      # No cgo means every target builds from one machine, with no
      # toolchain to install.
      - name: Build every target
        run: make release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries
          path: dist/
